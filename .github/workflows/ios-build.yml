name: Build iOS Companion (.ipa)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd apps/ios-companion
          xcodegen generate

      - name: Build Application with xcodebuild
        run: |
          xcodebuild build \
            -project apps/ios-companion/FinanceCompanion.xcodeproj \
            -scheme FinanceCompanion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/FinanceCompanion.app build/Payload/
          cd build
          zip -r -9 FinanceCompanion.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceCompanion-ipa
          path: build/FinanceCompanion.ipa
          retention-days: 7
