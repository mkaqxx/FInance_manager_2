name: FinanceCompanion
options:
  bundleIdPrefix: com.mkaqxx
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  FinanceCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/App
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/FinanceCompanion-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mkaqxx.FinanceCompanion
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: Resources/FinanceCompanion.entitlements
    dependencies:
      - target: FinanceWidgets

  FinanceWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Widgets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/FinanceWidgets-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mkaqxx.FinanceCompanion.Widgets
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_ENTITLEMENTS: Resources/FinanceWidgets.entitlements
